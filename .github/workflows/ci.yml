name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: API – test & audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
        env:
          DEMO_PASSWORD: ci-demo-password
      - name: Fail on high/critical vulnerabilities
        run: npm audit --audit-level=high

  client:
    name: Client – lint, build & audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Fail on high/critical vulnerabilities in shipped (production) dependencies
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v7
        with:
          name: client-dist
          path: client/dist
